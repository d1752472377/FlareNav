name = "flarenav"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ==============================================================================
# 💡 Cloudflare Pages 绑定 D1 数据库说明：
# ------------------------------------------------------------------------------
# 方式 A (推荐)：直接在 Cloudflare Pages 控制台可视化绑定（最简单，无需 ID）
# 1. 登录 Cloudflare -> 进入 Workers & Pages -> 点击您的 Pages 项目
# 2. Settings (设置) -> Functions (函数) -> D1 Database Bindings (D1 数据库绑定)
# 3. 点击「Add binding (添加绑定)」：
#    - Variable name (变量名称，必须大写): DB
#    - D1 database (选择您的数据库): flarenav_db
# 4. 点击 Save (保存) 并重新部署即可！
# ------------------------------------------------------------------------------
# 方式 B：通过 wrangler.toml 绑定（需填入 wrangler d1 create 返回的真实 database_id）
# [[d1_databases]]
# binding = "DB"
# database_name = "flarenav_db"
# database_id = "在这里替换为您执行 npx wrangler d1 create flarenav_db 获得的 UUID"
# ==============================================================================

[vars]
ADMIN_SECRET_KEY = "admin123"
SITE_NAME = "FlareNav"
